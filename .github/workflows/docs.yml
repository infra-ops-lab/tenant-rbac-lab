name: docs

# Build the runbooks into a website and publish it on GitHub Pages.
on:
  push:
    branches: [main]
    paths: ["*.md", "mkdocs.yml", "requirements-docs.txt", "manifests/**", "scripts/**", ".github/workflows/docs.yml"]
  pull_request:            # build only (no deploy) to catch broken docs before merge
  workflow_dispatch:       # manual "Run workflow" button

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: scripts/docs-prepare.sh
      - run: mkdocs build --strict      # fail on broken links / config errors
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
