site_name: Tenant RBAC Lab
site_description: Hands-on Kubernetes multi-tenancy lab - namespaces, x509 users, RBAC, quota, LimitRange, Pod Security, NetworkPolicy.
site_url: https://infra-ops-lab.github.io/tenant-rbac-lab/
repo_url: https://github.com/infra-ops-lab/tenant-rbac-lab
repo_name: infra-ops-lab/tenant-rbac-lab
edit_uri: ""
docs_dir: site-src          # generated by scripts/docs-prepare.sh; do not edit files there

nav:
  - Home: index.md
  - Tenant onboarding runbook: RUNBOOK.md
  - Certificate onboarding runbook: CERT-ONBOARDING-RUNBOOK.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - content.code.copy       # copy button on every command block
    - navigation.top
    - navigation.instant
    - search.highlight
    - toc.follow

markdown_extensions:
  - tables
  - toc: { permalink: true }
  - admonition
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.superfences
  - pymdownx.inlinehilite
